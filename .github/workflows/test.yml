name: Backend tests

on:
  pull_request:
    branches:
      - main
      - feat/stablecoin-monthly-invoices
  push:
    branches:
      - main
      - feat/stablecoin-monthly-invoices
      - feat/turnkey-company-wallets

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run tests
        run: npm test
